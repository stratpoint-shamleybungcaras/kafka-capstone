# Docker Compose configuration for Capstone Project
# Mapping

version: '3.8'

networks:
  capstone-network:
    driver: bridge

services:
  # 1. KAFKA (with JMX Exporter for Prometheus)
  kafka:
    build:
      context: ./jmx-exporter  
      dockerfile: Dockerfile
    container_name: capstone-kafka
    networks:
      - capstone-network
    ports:
      - "9093:9093"   
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,EXTERNAL://localhost:9093'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:SASL_PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      # SASL Security Enforcements
      KAFKA_SASL_ENABLED_MECHANISMS: 'PLAIN'
      KAFKA_LISTENER_NAME_EXTERNAL_SASL_ENABLED_MECHANISMS: 'PLAIN'
      KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.plain.PlainLoginModule required username='${KAFKA_ADMIN_USER}' password='${KAFKA_ADMIN_PASS}' user_admin='${KAFKA_ADMIN_PASS}' user_producer='${KAFKA_PRODUCER_PASS}' user_consumer='${KAFKA_CONSUMER_PASS}';"      
      KAFKA_OPTS: "-javaagent:/usr/share/jmx_exporter/jmx_prometheus_javaagent-0.19.0.jar=9999:/usr/share/jmx_exporter/kafka-jmx.yml"
    
  # 2. CONFLUENT SCHEMA REGISTRY
  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.0
    container_name: capstone-schema-registry
    networks:
      - capstone-network
    ports:
      - "8085:8081"
    depends_on:
      kafka:
        condition: service_started
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'PLAINTEXT://kafka:29092'
      SCHEMA_REGISTRY_LISTENERS: 'http://0.0.0.0:8081'
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/subjects || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. CUSTOM KAFKA CONNECT (PostgreSQL Sink)
  kafka-connect:
    build:
      context: ./connect
      dockerfile: Dockerfile
    container_name: capstone-kafka-connect
    networks:
      - capstone-network
    ports:
      - "8086:8083"
    depends_on:
        kafka:
          condition: service_started
        schema-registry:
          condition: service_healthy
        postgres:
          condition: service_healthy
    environment:
      CONNECT_BOOTSTRAP_SERVERS: 'kafka:29092'
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: compose-connect-group
      # Internal state storage configuration topics for distributed mode
      CONNECT_CONFIG_STORAGE_TOPIC: docker-connect-configs
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_TOPIC: docker-connect-offsets
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_TOPIC: docker-connect-status
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      # Setup default deserializers to leverage your Avro Schema Registry
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: 'http://schema-registry:8081'

  # 4. KAFKA UI (Kafka Dashboard)
  kafka-ui: 
    image: provectuslabs/kafka-ui:latest
    container_name: capstone-kafka-ui
    networks:
      - capstone-network
    depends_on:
      kafka:
          condition: service_started
      schema-registry:
          condition: service_healthy
      kafka-connect:
          condition: service_healthy
      postgres:
          condition: service_healthy
      mongo:
          condition: service_healthy
    ports:
      - "8087:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: capstone-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: postgres-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
      DYNAMIC_CONFIG_ENABLED: 'true'  


  # 5. POSTGRESQL DATABASE (Analytics Destination)
  postgres:
    image: postgres:16-alpine
    container_name: capstone-postgres
    networks:
      - capstone-network
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kafka-capstone
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kafka-capstone"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 6. PROMETHEUS (Waits for Kafka to be healthy)
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: capstone-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - capstone-network
    depends_on:
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 5s
      retries: 3

  # 7. GRAFANA (Waits for Prometheus to be healthy)
  grafana:
    image: grafana/grafana:10.4.0
    container_name: capstone-grafana
    ports:
      - "3000:3000"
    networks:
      - capstone-network
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 3

  # 8. MONGODB (Raw Archival Destination)
  mongo:
    image: mongo:latest
    container_name: capstone-mongo
    networks:
      - capstone-network
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  grafana_data:
  mongo_data: